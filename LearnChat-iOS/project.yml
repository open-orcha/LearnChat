name: LearnChat
options:
  bundleIdPrefix: com.learnchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptySchemes: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FX6LQ4M698
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LearnChat:
    type: application
    platform: iOS
    sources:
      - path: LearnChat
    info:
      path: LearnChat/Info.plist
      properties:
        CFBundleDisplayName: LearnChat
        CFBundleName: LearnChat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The server is plain http on the LAN (same as Android's cleartextTrafficPermitted).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: LearnChat talks to the model server running on your Mac over Wi-Fi.
        NSPhotoLibraryUsageDescription: Pick a photo or video to describe to the model. The file is analysed on this phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnchat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  LearnChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LearnChatTests
    dependencies:
      - target: LearnChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnchat.app.tests
        GENERATE_INFOPLIST_FILE: YES
  LearnChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LearnChatUITests
    dependencies:
      - target: LearnChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnchat.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LearnChat:
    build:
      targets:
        LearnChat: all
        LearnChatTests: [test]
        LearnChatUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LearnChatTests
        - LearnChatUITests
