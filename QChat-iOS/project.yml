name: QChat
options:
  bundleIdPrefix: com.qchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptySchemes: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FX6LQ4M698
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  QChat:
    type: application
    platform: iOS
    sources:
      - path: QChat
    info:
      path: QChat/Info.plist
      properties:
        CFBundleDisplayName: QChat
        CFBundleName: QChat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The server is plain http on the LAN (same as Android's cleartextTrafficPermitted).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: QChat talks to the model server running on your Mac over Wi-Fi.
        NSPhotoLibraryUsageDescription: Pick a photo or video to describe to the model. The file is analysed on this phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qchat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  QChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QChatTests
    dependencies:
      - target: QChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qchat.app.tests
        GENERATE_INFOPLIST_FILE: YES
  QChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QChatUITests
    dependencies:
      - target: QChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qchat.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QChat:
    build:
      targets:
        QChat: all
        QChatTests: [test]
        QChatUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QChatTests
        - QChatUITests
